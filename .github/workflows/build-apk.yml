name: Build APK

on:
  push:
    branches: [main, trabajo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Firma debug: si defines el secreto DEBUG_KEYSTORE_BASE64 se reutiliza siempre la misma llave
      # (así puedes actualizar la app sin desinstalarla). Si no, se genera una nueva en cada build.
      - name: Preparar debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Opcional: secreto GOOGLE_SERVICES_JSON con el contenido de google-services.json.
      # Sin él la APK compila, pero Gemini, Auth y Firestore no funcionarán.
      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Sin GOOGLE_SERVICES_JSON: la APK se genera sin configuración de Firebase."
          fi

      - name: Permiso de ejecución de gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Neptuno-debug.apk

      - name: Subir como artefacto del run
        uses: actions/upload-artifact@v4
        with:
          name: Neptuno-debug-apk
          path: Neptuno-debug.apk

      # Release fijo "apk-latest": su APK se descarga directo desde la pestaña Releases (cómodo en el móvil).
      - name: Publicar en Releases (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest Neptuno-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK debug (último build)" \
            --notes "Build automático de la rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}."
