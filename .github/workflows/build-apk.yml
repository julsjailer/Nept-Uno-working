name: Build APK

on:
  push:
    branches: [main, trabajo]
    # Los cambios que solo tocan documentación (p. ej. UNANZE.md) no recompilan la APK.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Por defecto el caché de Gradle solo se escribe desde la rama principal; aquí se trabaja en "trabajo",
          # así que sin esto cada corrida bajaba todas las librerías de Maven Central (y recibía 429).
          cache-read-only: false

      # Robolectric descarga su propio jar de Android a ~/.m2 en tiempo de ejecución; se guarda aparte.
      - name: Caché de Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # Llave de firma debug fija (ci/ci-debug.jks, contraseña estándar "android"): todas las APK
      # salen con la misma firma, así que puedes instalar versiones nuevas encima de la anterior.
      - name: Preparar debug.keystore
        run: cp ci/ci-debug.jks debug.keystore

      # Opcional: secreto GOOGLE_SERVICES_JSON, o el archivo app/google-services.json dentro del repo.
      # Sin ninguno de los dos la APK compila, pero Gemini, Auth y Firestore no funcionarán.
      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "Sin google-services.json: la APK se genera sin configuración de Firebase."
          fi

      - name: Permiso de ejecución de gradlew
        run: chmod +x gradlew

      # Diagnóstico de dependencias: comprueba en Maven Central que las librerías candidatas EXISTEN y qué versiones
      # tienen (el runner sí llega a Maven Central). Añade aquí cualquier coordenada nueva ANTES de usarla en Gradle.
      - name: Diagnóstico de dependencias
        continue-on-error: true
        run: |
          {
            for c in com/alphacephei/vosk-android net/java/dev/jna/jna xyz/rementia/openwakeword ai/picovoice/porcupine-android; do
              echo "--- $c"
              curl -sS --max-time 40 -w '\nHTTP %{http_code}\n' "https://repo.maven.apache.org/maven2/$c/maven-metadata.xml" \
                | grep -E "<latest>|<release>|HTTP" || echo "sin respuesta"
            done
            echo "--- modelo Vosk español (cabeceras)"
            curl -sSI --max-time 40 https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip | grep -iE "^HTTP|content-length" || echo "sin respuesta"
          } > diag.log 2>&1

      # Los tests no bloquean la APK (si fallan, el job sigue en verde y el fallo queda en ci-logs); su resultado queda en el log (rama ci-logs).
      - name: Tests unitarios
        continue-on-error: true
        run: |
          set -o pipefail
          # Hasta 3 intentos: Maven Central a veces responde 429 (demasiadas peticiones) en los runners.
          for i in 1 2 3 4; do
            ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache 2>&1 | tee -a test.log && exit 0
            echo "Intento $i fallido, reintentando en 45 s..." | tee -a test.log
            sleep 45
          done
          exit 1

      - name: Compilar APK debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Neptuno-debug.apk

      # Variante ligera solo ARM (menos espacio al instalar en los Redmi). Misma firma y mismo paquete.
      - name: Compilar variante ARM ligera
        continue-on-error: true
        run: |
          ./gradlew assembleDebug -PsoloArm --no-daemon 2>&1 | tail -5
          cp app/build/outputs/apk/debug/app-debug.apk Neptuno-debug-arm.apk
          ls -l Neptuno-debug-arm.apk

      # Comprueba que la APK incluye los recursos de Firebase generados desde google-services.json.
      - name: Verificar Firebase en la APK
        continue-on-error: true
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          {
            echo "aapt2: $AAPT2"
            "$AAPT2" dump resources Neptuno-debug.apk | grep -E "string/(default_web_client_id|google_app_id|gcm_defaultSenderId|project_id)" || echo "FALTAN recursos de Firebase en la APK"
          } 2>&1 | tee verify.log

      # Análisis técnico de la APK (para diagnosticar "no se pudo instalar"): firma, manifiesto, alineación, contenido.
      - name: Analizar APK
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "build-tools: $BT"
            echo "--- tamaño y SHA-256"
            ls -l Neptuno-debug.apk Neptuno-debug-arm.apk 2>&1; sha256sum Neptuno-debug.apk
            echo "--- apksigner verify"
            "$BT/apksigner" verify --verbose --print-certs Neptuno-debug.apk 2>&1 | head -30
            echo "--- aapt2 badging (paquete, versión, SDK, ABIs, permisos)"
            "$BT/aapt2" dump badging Neptuno-debug.apk 2>&1 | grep -E "^package|sdkVersion|targetSdk|native-code|uses-permission|launchable|debuggable" | head -40
            echo "--- zipalign (4 bytes)"
            "$BT/zipalign" -c -v 4 Neptuno-debug.apk 2>&1 | tail -3
            echo "--- zipalign (páginas de 16 KB)"
            "$BT/zipalign" -c -P 16 -v 4 Neptuno-debug.apk 2>&1 | tail -3
            echo "--- zip íntegro"
            unzip -tq Neptuno-debug.apk | tail -2
            echo "--- 15 archivos más grandes"
            unzip -l Neptuno-debug.apk | sort -k1 -n -r | head -15
            echo "--- ABIs en lib/"
            unzip -l Neptuno-debug.apk | grep -oE "lib/[^/]+/" | sort | uniq -c
          } > apk.log 2>&1 || true
          cat apk.log

      - name: Subir como artefacto del run
        uses: actions/upload-artifact@v4
        with:
          name: Neptuno-debug-apk
          path: Neptuno-debug.apk

      # Dos releases: `apk-latest` (siempre el último, enlace fijo) y `v1.0.<n>` (uno por build, se conservan los 25
      # últimos) para poder volver a una versión anterior si una falla.
      - name: Publicar en Releases (apk-latest y versión)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          SHA256=$(sha256sum Neptuno-debug.apk | cut -d' ' -f1)
          MSG=$(git log -1 --format=%s)
          NOTES="Versión ${VERSION} (versionCode ${GITHUB_RUN_NUMBER}) · rama ${GITHUB_REF_NAME} · commit ${GITHUB_SHA::7}
          Cambio: ${MSG}
          SHA-256 de Neptuno-debug.apk: ${SHA256}
          Neptuno-debug.apk = completa. Neptuno-debug-arm.apk = ligera solo ARM (misma firma)."
          cp Neptuno-debug.apk "Neptuno-v${VERSION}.apk"
          ASSETS="Neptuno-debug.apk"
          [ -f Neptuno-debug-arm.apk ] && ASSETS="$ASSETS Neptuno-debug-arm.apk"

          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest $ASSETS --target "$GITHUB_SHA" \
            --title "APK debug (último build) · v${VERSION}" --notes "$NOTES"

          gh release create "v${VERSION}" "Neptuno-v${VERSION}.apk" --target "$GITHUB_SHA" \
            --latest=false --prerelease --title "NEPTUNO v${VERSION}" --notes "$NOTES" || true

          # Conserva solo las 25 versiones más recientes.
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("v1.0."))] | sort_by(.createdAt) | reverse | .[25:] | .[].tagName' \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes || true; done

      # Instala la APK en un emulador Android 11 (como los Redmi con MIUI 12.5) y guarda el error EXACTO del instalador.
      - name: Habilitar KVM
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar instalación en emulador
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash ci/probar-instalacion.sh

      # Siempre (también si algo falló): deja el final de los logs en la rama "ci-logs",
      # para poder leerlos sin abrir la pestaña Actions.
      - name: Guardar logs en la rama ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          {
            echo "run #${GITHUB_RUN_NUMBER} · commit ${GITHUB_SHA::7} · rama ${GITHUB_REF_NAME}"
            echo
            echo "=== TESTS (últimas 120 líneas) ==="
            tail -n 120 test.log 2>/dev/null || echo "sin log de tests"
            echo
            echo "=== COMPILACIÓN (últimas 200 líneas) ==="
            tail -n 200 build.log 2>/dev/null || echo "sin log de compilación"
            echo
            echo "=== DIAGNÓSTICO DE DEPENDENCIAS ==="
            cat diag.log 2>/dev/null || echo "sin diagnóstico"
            echo
            echo "=== ANÁLISIS DE LA APK ==="
            cat apk.log 2>/dev/null || echo "sin análisis"
            echo
            echo "=== INSTALACIÓN EN EMULADOR (Android 11) ==="
            cat emu.log 2>/dev/null || echo "sin prueba de emulador"
            echo
            echo "=== VERIFICACIÓN FIREBASE EN LA APK ==="
            cat verify.log 2>/dev/null || echo "sin verificación"
          } > /tmp/ci-logs/ultimo-log.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --quiet . || true
          cp /tmp/ci-logs/ultimo-log.txt ultimo-log.txt
          git add ultimo-log.txt
          git commit -q -m "log de CI #${GITHUB_RUN_NUMBER}"
          git push --force origin ci-logs
