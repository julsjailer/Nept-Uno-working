name: Build APK

on:
  push:
    branches: [main, trabajo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Llave de firma debug fija (ci/ci-debug.jks, contraseña estándar "android"): todas las APK
      # salen con la misma firma, así que puedes instalar versiones nuevas encima de la anterior.
      - name: Preparar debug.keystore
        run: cp ci/ci-debug.jks debug.keystore

      # Opcional: secreto GOOGLE_SERVICES_JSON con el contenido de google-services.json.
      # Sin él la APK compila, pero Gemini, Auth y Firestore no funcionarán.
      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Sin GOOGLE_SERVICES_JSON: la APK se genera sin configuración de Firebase."
          fi

      - name: Permiso de ejecución de gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Neptuno-debug.apk

      - name: Subir como artefacto del run
        uses: actions/upload-artifact@v4
        with:
          name: Neptuno-debug-apk
          path: Neptuno-debug.apk

      # Release fijo "apk-latest": su APK se descarga directo desde la pestaña Releases (cómodo en el móvil).
      - name: Publicar en Releases (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest Neptuno-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK debug (último build)" \
            --notes "Build automático de la rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}."
